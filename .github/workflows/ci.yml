name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test (不变量回归)
        run: python -m tests.smoke_test

      - name: Correctness test (分层逻辑断言)
        # 真实库 data/real_universe 已被 gitignore，CI 环境缺失时会优雅跳过
        # 真实库回归锚点，仅本地含真实数据时才执行
        run: python -m tests.correctness_test
